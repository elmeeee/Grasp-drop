<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>Otter Web Hub</title>
  <style>
    :root {
      --bg: #0A0F1A; --surface: #111A2B; --surface-2: #17223A; --surface-3: #1E2C48;
      --border: #223152; --text: #EDF2FA; --muted: #8794AD;
      --primary: #1A89E4; --primary-soft: rgba(26,137,228,.14);
      --success: #22C55E; --danger: #F05252;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    body { min-height: 100vh; padding: 20px 16px 40px; }
    .wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
    header { display: flex; align-items: center; gap: 12px; padding-top: 6px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    header p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
    .title { display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .count { font-size: 12px; color: var(--muted); background: var(--surface-2); border-radius: 999px; padding: 3px 9px; font-weight: 600; }
    .drop { display: block; border: 2px dashed #2C4166; border-radius: 16px; padding: 28px 16px; text-align: center; cursor: pointer; transition: border-color .2s, background .2s; }
    .drop.over, .drop:hover { border-color: var(--primary); background: var(--primary-soft); }
    .drop strong { display: block; font-size: 16px; margin-bottom: 4px; }
    .drop small { color: var(--muted); font-size: 13px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px;
      background: var(--primary); color: #fff; font: inherit; font-size: 15px; font-weight: 600; padding: 13px 18px;
      cursor: pointer; text-decoration: none; width: 100%; }
    .btn:disabled { opacity: .5; cursor: default; }
    .btn.ghost { background: var(--surface-3); }
    .queue { list-style: none; padding: 0; margin: 12px 0 0; display: flex; flex-direction: column; gap: 8px; }
    .queue li { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
    .queue .row { display: flex; justify-content: space-between; gap: 10px; }
    .queue .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .queue .state { color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
    .queue .state.ok { color: var(--success); }
    .queue .state.bad { color: var(--danger); }
    .bar { height: 5px; background: var(--surface-3); border-radius: 999px; margin-top: 8px; overflow: hidden; }
    .bar span { display: block; height: 100%; width: 0; background: var(--primary); border-radius: 999px; transition: width .2s; }
    .item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px; background: var(--surface-2); border-radius: 12px; }
    .item + .item { margin-top: 8px; }
    .item .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item small { color: var(--muted); font-size: 12px; }
    .item a { color: #fff; background: var(--surface-3); text-decoration: none; font-size: 13px; font-weight: 600; padding: 8px 12px; border-radius: 10px; flex: none; }
    .item a:hover { background: var(--primary); }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 14px 0; }
    input[type=file] { display: none; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Otter Web Hub</h1>
      <p>Send files to this device over your Wi-Fi.</p>
    </div>
  </header>

  <section class="card">
    <div class="title"><span>Send files here</span></div>
    <label class="drop" id="drop" for="picker">
      <strong>Tap to choose files</strong>
      <small>Select several at once, or drop them here</small>
    </label>
    <input type="file" id="picker" multiple />
    <button class="btn" id="send" disabled style="margin-top:12px">Upload</button>
    <ul class="queue" id="queue"></ul>
  </section>

  <section class="card">
    <div class="title"><span>Available to download</span><span class="count" id="count">0</span></div>
    <div id="files"><div class="empty">Loading…</div></div>
  </section>
</div>

<script>
  const picker = document.getElementById("picker");
  const drop = document.getElementById("drop");
  const sendBtn = document.getElementById("send");
  const queueEl = document.getElementById("queue");
  let pending = [];

  function fmt(bytes) {
    if (bytes < 1024) return bytes + " B";
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
    if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + " MB";
    return (bytes / 1073741824).toFixed(2) + " GB";
  }
  function esc(v) {
    return String(v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }

  function setPending(files) {
    pending = Array.from(files);
    sendBtn.disabled = pending.length === 0;
    sendBtn.textContent = pending.length ? `Upload ${pending.length} file${pending.length > 1 ? "s" : ""}` : "Upload";
    queueEl.innerHTML = pending.map((f, i) => `
      <li data-i="${i}"><div class="row"><span class="name">${esc(f.name)}</span><span class="state">${fmt(f.size)}</span></div>
      <div class="bar"><span></span></div></li>`).join("");
  }

  picker.addEventListener("change", () => setPending(picker.files));
  ["dragenter", "dragover"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.add("over"); }));
  ["dragleave", "drop"].forEach((t) => drop.addEventListener(t, (e) => { e.preventDefault(); drop.classList.remove("over"); }));
  drop.addEventListener("drop", (e) => setPending(e.dataTransfer.files));

  // Uploads one file per request so each file has its own progress bar.
  function uploadOne(file, index) {
    return new Promise((resolve) => {
      const item = queueEl.querySelector(`li[data-i="${index}"]`);
      const bar = item.querySelector(".bar span");
      const state = item.querySelector(".state");
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "/upload");
      xhr.upload.onprogress = (e) => {
        if (e.lengthComputable) {
          const pct = Math.round((e.loaded / e.total) * 100);
          bar.style.width = pct + "%";
          state.textContent = pct + "%";
        }
      };
      xhr.onload = () => {
        const ok = xhr.status === 200;
        state.textContent = ok ? "Done" : "Failed";
        state.className = "state " + (ok ? "ok" : "bad");
        bar.style.width = "100%";
        resolve(ok);
      };
      xhr.onerror = () => {
        state.textContent = "Failed";
        state.className = "state bad";
        resolve(false);
      };
      const form = new FormData();
      form.append("file", file, file.name);
      xhr.send(form);
    });
  }

  sendBtn.addEventListener("click", async () => {
    sendBtn.disabled = true;
    const files = pending;
    let done = 0;
    for (let i = 0; i < files.length; i++) {
      if (await uploadOne(files[i], i)) done++;
    }
    sendBtn.textContent = `Uploaded ${done} of ${files.length}`;
    picker.value = "";
    pending = [];
    loadFiles();
  });

  async function loadFiles() {
    try {
      const list = await (await fetch("/api/files", { cache: "no-store" })).json();
      document.getElementById("count").textContent = list.length;
      document.getElementById("files").innerHTML = list.length
        ? list.map((f) => `<div class="item"><div style="min-width:0"><div class="name">${esc(f.name)}</div><small>${fmt(f.size)}</small></div>
            <a href="/download/${encodeURIComponent(f.name)}" download>Download</a></div>`).join("")
        : '<div class="empty">No files yet</div>';
    } catch (_) {
      document.getElementById("files").innerHTML = '<div class="empty">Could not load files</div>';
    }
  }
  loadFiles();
  setInterval(loadFiles, 5000);
</script>
</body>
</html>

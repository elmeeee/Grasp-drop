<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grasp — Web Hub</title>
  <style>
    :root { --bg:#0b0f19; --card:#151c2c; --primary:#4f46e5; --accent:#06b6d4; --text:#f8fafc; --muted:#94a3b8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
      display:flex; flex-direction:column; align-items:center; padding:24px 16px; gap:18px; }
    .wrap { width:100%; max-width:520px; display:flex; flex-direction:column; gap:18px; }
    .card { background:var(--card); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:20px;
      box-shadow:0 14px 30px rgba(0,0,0,.4); }
    h1 { font-size:20px; margin:0 0 4px; text-align:center; }
    .sub { text-align:center; color:var(--muted); font-size:13px; margin:0 0 8px; }
    .title { font-size:13px; font-weight:700; margin-bottom:12px; display:flex; justify-content:space-between; }
    .muted { color:var(--muted); font-size:11px; font-weight:500; }
    .drop { border:2px dashed rgba(6,182,212,.4); border-radius:14px; padding:26px 16px; text-align:center;
      background:rgba(6,182,212,.03); cursor:pointer; }
    .drop:hover { background:rgba(6,182,212,.08); border-color:var(--accent); }
    .btn { background:linear-gradient(135deg,var(--primary),var(--accent)); color:#fff; border:none;
      padding:9px 18px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; margin-top:10px; }
    input[type=file] { display:none; }
    .status { margin-top:10px; font-size:13px; color:#22c55e; font-weight:600; text-align:center; }
    .list { display:flex; flex-direction:column; gap:8px; max-height:240px; overflow:auto; }
    .item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 12px;
      background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.05); border-radius:12px; }
    .name { font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta { font-size:11px; color:var(--muted); }
    .dl { background:rgba(255,255,255,.1); color:#fff; text-decoration:none; padding:6px 12px; border-radius:8px;
      font-size:12px; font-weight:600; }
    .dl:hover { background:var(--accent); }
    textarea { width:100%; height:80px; background:rgba(0,0,0,.3); border:1px solid rgba(255,255,255,.1);
      border-radius:12px; padding:12px; color:#fff; font-family:inherit; font-size:13px; resize:none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Grasp Web Hub</h1>
      <p class="sub">Share files with this device over your local network</p>
    </div>

    <div class="card">
      <div class="title">Clipboard Text</div>
      <textarea id="clip" placeholder="Paste text or links here…"></textarea>
      <button class="btn" style="width:100%" onclick="syncClipboard()">Sync Text</button>
      <div class="status" id="clipStatus"></div>
    </div>

    <div class="card">
      <div class="title">Upload Files</div>
      <div class="drop" onclick="document.getElementById('f').click()">
        <div style="font-size:14px;font-weight:600;margin-bottom:4px">Tap to choose files</div>
        <div class="muted">Photos, videos, documents, archives</div>
        <button class="btn" type="button">Choose Files</button>
        <input type="file" id="f" multiple onchange="upload(this.files)" />
      </div>
      <div class="status" id="upStatus"></div>
    </div>

    <div class="card">
      <div class="title"><span>Received / Shared Files</span><span class="muted" id="count">—</span></div>
      <div class="list" id="list"><div class="muted" style="text-align:center;padding:12px">Loading…</div></div>
    </div>
  </div>

  <script>
    function fmt(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
      if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + " MB";
      return (bytes / 1073741824).toFixed(2) + " GB";
    }

    async function syncClipboard() {
      const text = document.getElementById("clip").value;
      if (!text) return;
      const status = document.getElementById("clipStatus");
      status.textContent = "Syncing…";
      try {
        const response = await fetch("/api/clipboard", { method: "POST", body: text });
        status.textContent = response.ok ? "✓ Synced" : "✕ Failed";
      } catch (error) {
        status.textContent = "✕ " + error;
      }
    }

    async function upload(files) {
      if (!files || !files.length) return;
      const status = document.getElementById("upStatus");
      let completed = 0;
      for (const file of files) {
        status.textContent = `Uploading ${file.name}…`;
        const form = new FormData();
        form.append("file", file);
        try {
          const response = await fetch("/upload", { method: "POST", body: form });
          if (!response.ok) {
            status.textContent = "✕ Failed: " + file.name;
            return;
          }
          completed++;
        } catch (error) {
          status.textContent = "✕ " + error;
          return;
        }
      }
      status.textContent = `✓ Uploaded ${completed} file(s)`;
      loadFiles();
    }

    async function loadFiles() {
      try {
        const files = await (await fetch("/api/files")).json();
        const list = document.getElementById("list");
        document.getElementById("count").textContent =
          files.length + " file" + (files.length === 1 ? "" : "s");
        if (!files.length) {
          list.innerHTML = '<div class="muted" style="text-align:center;padding:12px">No files yet</div>';
          return;
        }
        list.innerHTML = files.map((file) =>
          `<div class="item">
             <div>
               <div class="name">${escapeHtml(file.name)}</div>
               <div class="meta">${fmt(file.size)}</div>
             </div>
             <a class="dl" href="/download/${encodeURIComponent(file.name)}" download="${escapeHtml(file.name)}">Download</a>
           </div>`).join("");
      } catch (error) {
        console.error(error);
      }
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (c) =>
        ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
    }

    loadFiles();
    setInterval(loadFiles, 5000);
    (async () => {
      try {
        const response = await (await fetch("/api/clipboard")).json();
        if (response.text) document.getElementById("clip").value = response.text;
      } catch (_) {}
    })();
  </script>
</body>
</html>

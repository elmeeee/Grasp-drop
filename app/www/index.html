<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Otter</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="30" height="30" fill="none">
            <defs>
              <linearGradient id="g" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#4f46e5" />
                <stop offset="100%" stop-color="#06b6d4" />
              </linearGradient>
            </defs>
            <path d="M 13.5 7.5 C 16.538 7.5 19 9.962 19 13 C 19 16.038 16.538 18.5 13.5 18.5 C 10.462 18.5 8 16.038 8 13 M 8 13 L 15 13"
                  stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M 10.5 16.5 C 7.462 16.5 5 14.038 5 11 C 5 7.962 7.462 5.5 10.5 5.5 C 13.538 5.5 16 7.962 16 11"
                  stroke="#06b6d4" stroke-opacity="0.6" stroke-width="2.2" stroke-linecap="round" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>Otter</h1>
          <p id="device-alias">Starting…</p>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-service" checked />
        <span class="slider"></span>
      </label>
    </header>

    <main class="content">
      <section class="card send-card">
        <div class="card-title">Send Files</div>
        <div class="drop-zone" id="drop-zone">
          <p class="dz-title">Tap to choose files</p>
          <p class="dz-sub">Photos, videos, documents, archives</p>
          <input type="file" id="file-input" multiple hidden />
        </div>
      </section>

      <section class="card">
        <div class="card-title">
          <span>Nearby Devices</span>
          <button class="icon-btn" id="refresh" title="Scan network">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-3-6.7M21 3v5h-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="peer-list" id="peer-list">
          <p class="empty">Searching for devices on your network…</p>
        </div>
      </section>

      <section class="card">
        <div class="card-title">
          <span>Received Files</span>
          <span class="muted" id="file-count">—</span>
        </div>
        <div class="file-list" id="file-list">
          <p class="empty">No files yet</p>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Otter</title>
  <link rel="icon" type="image/png" href="icon-256.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true"><img src="icon-256.png" alt="" width="44" height="44" /></div>
        <div class="brand-text">
          <h1>Otter</h1>
          <p id="device-alias">Starting…</p>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggle-service" checked />
        <span class="slider"></span>
      </label>
    </header>

    <main class="content">
      <section class="card send-card">
        <div class="card-title">Send Files</div>
        <div class="drop-zone" id="drop-zone">
          <p class="dz-title">Tap to choose files</p>
          <p class="dz-sub">Photos, videos, documents, archives</p>
          <input type="file" id="file-input" multiple hidden />
        </div>
      </section>

      <section class="card">
        <div class="card-title">
          <span>Nearby Devices</span>
          <button class="icon-btn" id="refresh" title="Scan network">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12a9 9 0 1 1-3-6.7M21 3v5h-5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </button>
        </div>
        <div class="peer-list" id="peer-list">
          <p class="empty">Searching for devices on your network…</p>
        </div>
      </section>

      <section class="card">
        <div class="card-title">
          <span>Received Files</span>
          <span class="muted" id="file-count">—</span>
        </div>
        <div class="file-list" id="file-list">
          <p class="empty">No files yet</p>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>

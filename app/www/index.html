<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Otter</title>
  <link rel="icon" type="image/png" href="icon-256.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <div class="topbar-sticky">
    <header class="topbar">
      <div class="brand">
        <img class="brand-icon" src="icon-256.png" alt="" width="44" height="44" />
        <div class="brand-text">
          <h1>Otter</h1>
          <p id="device-name">Starting…</p>
        </div>
      </div>
      <div class="topbar-actions">
        <label class="visibility" title="Visible to nearby devices">
          <input type="checkbox" id="visible" />
          <span class="track"><span class="thumb"></span></span>
        </label>
        <button class="icon-btn" data-action="settings" aria-label="Settings" id="settings-btn"></button>
      </div>
    </header>
    </div>

    <div class="status" id="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Starting…</span>
    </div>

    <section class="hero">
      <div class="hero-copy">
        <h2>Send files</h2>
        <p>Pick a device and choose what to send. Files go directly over your Wi-Fi.</p>
      </div>
      <button class="btn primary block" data-action="send-hero" id="send-hero">
        <span class="btn-icon" data-icon="send"></span>
        <span>Choose files</span>
      </button>
    </section>

    <section class="section" id="live-section" hidden>
      <div class="section-head">
        <h3>Live activity</h3>
        <span class="count" id="live-count"></span>
      </div>
      <div class="stack" id="live"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>Nearby devices</h3>
        <button class="icon-btn" data-action="refresh" aria-label="Refresh devices" data-icon="refresh"></button>
      </div>
      <div class="stack" id="peers"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>Inbox</h3>
        <span class="count" id="inbox-count"></span>
      </div>
      <p class="hint">Files you received that are not saved yet.</p>
      <div class="stack" id="inbox"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h3>History</h3>
        <button class="text-btn danger" data-action="clear-history" id="clear-history">Clear</button>
      </div>
      <div class="stack" id="history"></div>
    </section>
  </div>

  <input type="file" id="file-input" multiple hidden />
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>

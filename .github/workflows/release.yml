name: Build & Release Grasp

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Cross-Platform Release Assets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build macOS App Bundle
        run: |
          chmod +x build_mac_app.sh
          ./build_mac_app.sh
          cd bin
          zip -r Grasp-macOS.zip Grasp.app

      - name: Build Standalone Windows & Linux Binaries
        run: |
          go mod init grasp || true
          GOOS=windows GOARCH=amd64 go build -o bin/grasp-windows-x64.exe ./cmd/grasp-server
          GOOS=linux GOARCH=amd64 go build -o bin/grasp-linux-x64 ./cmd/grasp-server

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: grasp-binaries
          path: |
            bin/Grasp-macOS.zip
            bin/grasp-windows-x64.exe
            bin/grasp-linux-x64

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Grasp-macOS.zip
            bin/grasp-windows-x64.exe
            bin/grasp-linux-x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

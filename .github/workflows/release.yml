name: Build & Release Otter

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Cross-Platform Release Assets
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu,x86_64-unknown-linux-gnu,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cross-compilation tools
        run: |
          brew install mingw-w64 zig
          cargo install cargo-ndk cargo-zigbuild

      - name: Build macOS App Bundle
        run: |
          chmod +x build_mac_app.sh
          ./build_mac_app.sh
          cd bin
          zip -r Otter-macOS.zip Otter.app
          cp Otter-macOS.zip Otter.app.zip

      - name: Build Rust Core for all platforms
        run: |
          chmod +x scripts/build_core.sh
          ./scripts/build_core.sh
          cp core/otter-core/target/release/otter bin/otter-macos

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: otter-binaries
          path: |
            bin/Otter-macOS.zip
            bin/Otter.app.zip
            bin/otter-windows-x64.exe
            bin/otter-linux-x64
            bin/otter-macos

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/Otter-macOS.zip
            bin/Otter.app.zip
            bin/otter-windows-x64.exe
            bin/otter-linux-x64
            bin/otter-macos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build the Rust core for Android
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 \
            -o app/android/app/src/main/jniLibs \
            build --manifest-path core/otter-core/Cargo.toml --release

      - name: Build the APK
        run: |
          cd app
          npm install
          npx cap sync android
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: otter-android
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
